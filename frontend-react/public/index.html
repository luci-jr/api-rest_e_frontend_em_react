<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="Aplicação SPA em React integrada à API Go — Bairros de Belém"
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <!-- Fontes Retro Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Space+Grotesk:wght@400;600;700&family=VT323&display=swap" rel="stylesheet">
    <!--
      O arquivo manifest.json fornece metadados utilizados quando o seu aplicativo web é
      instalado no dispositivo móvel ou desktop do usuário. Consulte: https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <!--
      Observe o uso de %PUBLIC_URL% nas tags acima.
      Ele será substituído pela URL da pasta `public` durante o processo de build.
      Apenas arquivos dentro da pasta `public` podem ser referenciados diretamente a partir do HTML.

      Ao contrário de "/favicon.ico" ou "favicon.ico", o caminho "%PUBLIC_URL%/favicon.ico"
      funcionará corretamente tanto com roteamento no lado do cliente quanto com uma URL pública que não seja raiz.
      Saiba como configurar uma URL pública customizada executando `npm run build`.
    -->
    <title>Bairros de Belém</title>
  </head>
  <body>
    <noscript>Tu precisas habilitar o JavaScript no navegador para rodar esta aplicação.</noscript>
    <div id="root"></div>
    <!--
      Este arquivo HTML é um template.
      Se tu o abrires diretamente no navegador sem o servidor, verás uma página vazia.

      Tu podes adicionar fontes web, meta tags ou scripts analíticos a este arquivo.
      O processo de build do React posicionará os scripts empacotados dentro da tag <body>.

      Para iniciar o servidor de desenvolvimento, executa `npm start`.
      Para gerar o pacote de produção otimizado, executa `npm run build`.
    -->
  </body>
</html>
